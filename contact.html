
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Class 16: Step 1: my contact page -->
    <title>Contact - Sam Crimmins</title>

    <!-- Class 12 · Step 1: a typeface I chose -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <!-- Class 15: Step 2: my third file -->
    <script src="script.js" defer></script>
</head>

<body>

    <!-- Lab 13 · Task 3: navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="skills.html">Skills</a></li>

            <!-- Class 16: Step 1: the contact link -->
            <li><a href="contact.html" class="current">Contact</a></li>

            <!-- Class 15 · Step 3: the theme button -->
            <li><button id="theme-toggle" type="button">Dark</button></li>
        </ul>
    </nav>

    <!-- Lab 12 · Task 1: group the text beside the photo -->
    <header>
        <img src="images/me.jpg"
             alt="Portrait of Sam Crimmins"
             class="portrait">

        <div class="header-text">
            <h1>Sam Crimmins</h1>
            <p>
                Computer Science major and Psychology minor at Le Moyne College,
                interested in cybersecurity and software development.
            </p>
        </div>
    </header>

    <main>

        <!-- Class 18: Step 1: let Netlify handle the submission -->
        <!-- Lab 18: Task 2: send visitors to my thanks page -->
        <form id="contact-form"
              name="contact"
              method="POST"
              action="/thanks.html"
              data-netlify="true"
              netlify-honeypot="bot-field">

        <!-- Lab 18: Task 6: improve the email field on phones -->
        <input type="email" id="email" name="email"
             inputmode="email" autocomplete="email" required>

             
            <!-- Class 18: Step 1: honeypot field -->
            <p class="hidden-field">
                <label>
                    Leave this empty:
                    <input name="bot-field" type="text">
                </label>
            </p>

            <!-- Class 16 · Step 2: a form -->
            <p>
                <label for="name">Your Name:</label>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="email">Your Email:</label>
                <input type="email" id="email" name="email" required>
            </p>

            <p>
                <label for="message">Your Message:</label>
                <textarea id="message"
                          name="message"
                          rows="5"
                          required></textarea>
            </p>

            <button type="submit">Submit</button>

            <!-- Class 16 · Step 3: form feedback -->
            <p id="form-status" role="status" aria-live="polite"></p>

        </form>

    </main>

    <!-- Lab 12 · Task 3: footer -->
    <footer>

        <!-- Class 15 · Step 2: the year, written by JavaScript -->
        <p>&copy; <span id="year"></span> Sam Crimmins</p>

        <a href="https://github.com/Trickster46123"
           target="_blank"
           rel="noopener">GitHub</a>

        <!-- Lab 15 · Task 5: back-to-top button -->
        <button id="back-to-top" type="button">Back to Top</button>

    </footer>

</body>
</html>
